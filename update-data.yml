name: Actualizar datos de mercado

on:
  schedule:
    # Corre cada 6 horas en días hábiles (lun-vie), horario Argentina (UTC-3)
    # 06:00, 10:00, 14:00, 18:00 ART = 09:00, 13:00, 17:00, 21:00 UTC
    - cron: '0 9,13,17,21 * * 1-5'
    # También a las 12:00 UTC los sábados (cierre semana)
    - cron: '0 12 * * 6'
  workflow_dispatch:   # Permite correrlo manualmente desde GitHub

permissions:
  contents: write      # Necesario para hacer commit del data.json

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Configurar Python 3.11
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: pip install -r requirements.txt

      # 4. Ejecutar el scraper y guardar data.json
      - name: Ejecutar fetch_data.py
        run: |
          python fetch_data.py > data.json
          echo "=== Contenido de data.json (primeras 40 líneas) ==="
          head -40 data.json

      # 5. Verificar que data.json es JSON válido
      - name: Validar JSON
        run: python -c "import json,sys; json.load(open('data.json')); print('✅ JSON válido')"

      # 6. Commit y push solo si hay cambios
      - name: Commit y push data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "Sin cambios en data.json"
          else
            git commit -m "chore: actualizar data.json [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push
          fi
