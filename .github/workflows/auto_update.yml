name: Actualizar Dashboard ASF
on:
  schedule:
    - cron: '0 12 * * *' # Corre todos los días a las 9 AM Argentina
  workflow_dispatch: # Permite correrlo a mano cuando quieras

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Instalar dependencias
        run: pip install requests
      - name: Correr script
        run: python update_data.py
      - name: Guardar cambios
        run: |
          git config --global user.name 'ASF-Bot'
          git config --global user.email 'bot@agrosinfronteras.com'
          git add index.html
          git commit -m "Actualización automática de precios" || exit 0
          git push
