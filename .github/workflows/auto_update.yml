name: Actualizar Precios Agro
on:
  schedule:
    - cron: '0 12 * * *' # Corre a las 09:00 AM hora Argentina cada día
  workflow_dispatch: # Botón manual para probarlo ahora

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install requests
      - name: Run Update Script
        run: python update_data.py
      - name: Save changes
        run: |
          git config --global user.name 'AgroBot'
          git config --global user.email 'bot@agros.com'
          git add index.html
          git commit -m "Precios del día actualizados" || echo "No hay cambios"
          git push
