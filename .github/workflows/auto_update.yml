name: SINCRONIZAR DASHBOARD
on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Instalar librerías
        run: pip install requests
      - name: Ejecutar Script de Precios
        run: python update_data.py
      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name 'ASF-Robot'
          git config --global user.email 'robot@agrosinfronteras.com'
          git add index.html
          git commit -m "Precios actualizados" || exit 0
          git push
