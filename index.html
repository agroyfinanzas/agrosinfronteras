<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agros Sin Fronteras | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg: #0d0f0d; --card-bg: #1a1d1a; --accent: #76c442; --text: #e0e7dc; --muted: #889488; --gold: #e8b74d; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; }
        header { padding: 40px 20px; text-align: center; background: linear-gradient(180deg, #162411 0%, var(--bg) 100%); border-bottom: 2px solid var(--accent); }
        .logo-img { max-width: 250px; height: auto; }
        .nav-tabs { display: flex; justify-content: center; gap: 10px; margin: -20px auto 30px; flex-wrap: wrap; }
        .tab-btn { background: #1a1d1a; border: 1px solid rgba(255,255,255,0.1); color: var(--muted); padding: 10px 20px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 0.75rem; }
        .tab-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .section { display: none; } .section.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 15px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .card-title { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
        .card-value { font-size: 2rem; font-weight: 900; }
        .badge { padding: 4px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: 900; border: 1px solid; }
        .buena { color: var(--accent); border-color: var(--accent); }
        .weather-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .weather-card { background: #161a16; padding: 15px; border-radius: 12px; text-align: center; }
    </style>
</head>
<body>

<header>
    <img src="logo.png" alt="ASF" class="logo-img" onerror="this.outerHTML='<h1 style=color:var(--accent)>AGROS SIN FRONTERAS</h1>'">
</header>

<div class="nav-tabs">
    <button class="tab-btn active" onclick="show('granos', this)">GRANOS</button>
    <button class="tab-btn" onclick="show('ganaderia', this)">GANADERÍA</button>
    <button class="tab-btn" onclick="show('indicadores', this)">INDICADORES</button>
    <button class="tab-btn" onclick="show('clima', this)">CLIMA</button>
    <button class="tab-btn" onclick="show('articulos', this)">ARTÍCULOS</button>
</div>

<div class="container">
    <div id="granos" class="section active">
        <div style="margin-bottom:20px; color:var(--gold)">💵 DÓLAR: <span id="val-dolar">$1.400,00</span></div>
        <div class="grid">
            <div class="card"><div class="card-title">Soja Rosario</div><div id="val-soja" class="card-value">$435.000</div></div>
            <div class="card"><div class="card-title">Maíz Rosario</div><div id="val-maiz" class="card-value">$265.000</div></div>
        </div>
    </div>

    <div id="ganaderia" class="section">
        <div class="grid">
            <div class="card"><div class="card-title">Novillo MAG</div><div id="val-novillo" class="card-value">$3.100</div></div>
            <div class="card"><div class="card-title">Ternero MAG</div><div id="val-ternero" class="card-value">$3.600</div></div>
        </div>
    </div>

    <div id="indicadores" class="section">
        <div class="grid">
            <div class="card">
                <div class="card-title">Urea / Soja</div>
                <div id="ratio-u-s" class="card-value">14.5</div>
                <span id="badge-u-s" class="badge buena">BUENA</span>
            </div>
        </div>
    </div>

    <div id="clima" class="section">
        <div class="weather-grid" id="weather-container">
            </div>
    </div>

    <div id="articulos" class="section">
        <div class="grid">
            <div class="card">
                <div class="card-title" style="color:var(--accent)">ARTÍCULO DESTACADO</div>
                <h3 style="margin:10px 0">Perspectivas Cosecha 2026</h3>
                <p style="font-size:0.8rem; color:var(--muted)">Análisis de mercado para la próxima campaña...</p>
            </div>
        </div>
    </div>
</div>

<script>
    function show(id, btn) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
</script>
</body>
</html>
