<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agros Sin Fronteras | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d0f0d; --card: #1a1d1a; --accent: #76c442; --text: #e0e7dc; --muted: #889488; --gold: #e8b74d; --red: #ff5f5f; }
        body { background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; }
        header { padding: 40px 20px; text-align: center; border-bottom: 2px solid var(--accent); background: linear-gradient(180deg, #162411 0%, var(--bg) 100%); }
        .logo { max-width: 250px; height: auto; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin: -20px auto 30px; flex-wrap: wrap; }
        .btn { background: #1a1d1a; border: 1px solid #333; color: var(--muted); padding: 12px 20px; border-radius: 50px; cursor: pointer; font-weight: 700; font-size: 0.8rem; }
        .btn.active { background: var(--accent); color: #000; }
        .container { max-width: 1100px; margin: auto; padding: 0 20px 100px; }
        .section { display: none; } .active-sec { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .card { background: var(--card); padding: 25px; border-radius: 15px; border: 1px solid #222; }
        .val { font-size: 2rem; font-weight: 900; display: block; margin-top: 5px; }
        .badge { padding: 4px 10px; border-radius: 5px; font-size: 0.7rem; font-weight: 900; border: 1px solid; }
        .buena { color: var(--accent); border-color: var(--accent); }
        .regular { color: var(--gold); border-color: var(--gold); }
        .mala { color: var(--red); border-color: var(--red); }
        .weather-card { background: #161a16; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #222; }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="ASF" class="logo" onerror="this.outerHTML='<h1 style=color:var(--accent)>AGROS SIN FRONTERAS</h1>'">
    </header>
    <div class="tabs">
        <button class="btn active" onclick="tab('g', this)">GRANOS</button>
        <button class="btn" onclick="tab('v', this)">GANADERÍA</button>
        <button class="btn" onclick="tab('i', this)">INDICADORES</button>
        <button class="btn" onclick="tab('c', this)">CLIMA</button>
    </div>
    <div class="container">
        <div id="g" class="section active-sec">
            <div style="margin-bottom:20px; color:var(--gold)">💵 DÓLAR BNA: <span id="val-dolar">$1,416.00</span></div>
            <div class="grid">
                <div class="card">SOJA <span id="val-soja" class="val">--</span></div>
                <div class="card">MAÍZ <span id="val-maiz" class="val">--</span></div>
                <div class="card">TRIGO <span id="val-trigo" class="val">--</span></div>
                <div class="card">GIRASOL <span id="val-girasol" class="val">--</span></div>
            </div>
        </div>
        <div id="v" class="section">
            <div class="grid">
                <div class="card">NOVILLO <span id="val-novillo" class="val">--</span></div>
                <div class="card">TERNERO <span id="val-ternero" class="val">--</span></div>
                <div class="card">VACA CON. <span id="val-vaca" class="val">--</span></div>
                <div class="card">NOVILLITO <span id="val-novillito" class="val">--</span></div>
            </div>
        </div>
        <div id="i" class="section">
            <div class="grid">
                <div class="card">UREA/SOJA <span id="ratio-u-s" class="val">--</span> <span id="badge-u-s" class="badge buena">BUENA</span></div>
                <div class="card">UREA/MAÍZ <span id="ratio-u-m" class="val">--</span> <span id="badge-u-m" class="badge buena">BUENA</span></div>
                <div class="card">CARNE/MAÍZ <span id="ratio-c-t" class="val">--</span> <span id="badge-c-t" class="badge buena">COMPRA</span></div>
            </div>
        </div>
        <div id="c" class="section">
            <div class="grid" id="weather-container"><div class="weather-card"><div style="font-size:0.7rem; color:var(--muted);">ROSARIO</div><div style="font-size:1.8rem; font-weight:900; color:var(--accent);">18.2°C</div></div><div class="weather-card"><div style="font-size:0.7rem; color:var(--muted);">CAÑUELAS</div><div style="font-size:1.8rem; font-weight:900; color:var(--accent);">18.5°C</div></div><div class="weather-card"><div style="font-size:0.7rem; color:var(--muted);">CÓRDOBA</div><div style="font-size:1.8rem; font-weight:900; color:var(--accent);">20.4°C</div></div><div class="weather-card"><div style="font-size:0.7rem; color:var(--muted);">PEHUAJÓ</div><div style="font-size:1.8rem; font-weight:900; color:var(--accent);">18.4°C</div></div><div class="weather-card"><div style="font-size:0.7rem; color:var(--muted);">SALTA</div><div style="font-size:1.8rem; font-weight:900; color:var(--accent);">20.5°C</div></div><div class="weather-card"><div style="font-size:0.7rem; color:var(--muted);">BAHÍA BLANCA</div><div style="font-size:1.8rem; font-weight:900; color:var(--accent);">18.6°C</div></div></div>
        </div>
    </div>
    <script>
        function tab(id, b) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active-sec'));
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(id).classList.add('active-sec');
            b.classList.add('active');
        }
    </script>
</body>
</html>
