<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agros Sin Fronteras</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d0f0d; --card: #1a1d1a; --accent: #76c442; --text: #e0e7dc; --gold: #e8b74d; }
        body { background: var(--bg); color: var(--text); font-family: 'Montserrat', sans-serif; margin: 0; }
        header { padding: 30px; text-align: center; border-bottom: 2px solid var(--accent); }
        .logo { max-width: 200px; height: auto; }
        .tabs { display: flex; justify-content: center; gap: 10px; padding: 20px; }
        .btn { background: #1a1d1a; border: 1px solid #333; color: #888; padding: 10px 20px; border-radius: 50px; cursor: pointer; }
        .btn.active { background: var(--accent); color: #000; }
        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .section { display: none; } .active-sec { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; border: 1px solid #222; }
        .val { font-size: 1.8rem; font-weight: 900; display: block; margin-top: 5px; color: #fff; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 900; border: 1px solid; margin-top: 10px; display: inline-block; }
        .buena { color: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>
    <header>
        <img src="logo.png" alt="ASF" class="logo" onerror="this.outerHTML='<h1>AGROS SIN FRONTERAS</h1>'">
    </header>
    <div class="tabs">
        <button class="btn active" onclick="tab('g', this)">GRANOS</button>
        <button class="btn" onclick="tab('v', this)">GANADERÍA</button>
        <button class="btn" onclick="tab('i', this)">INDICADORES</button>
    </div>
    <div class="container">
        <div id="g" class="section active-sec">
            <div style="margin-bottom:20px; color:var(--gold)">💵 DÓLAR: <span id="val-dolar">--</span></div>
            <div class="grid">
                <div class="card">SOJA <span id="val-soja" class="val">--</span></div>
                <div class="card">MAÍZ <span id="val-maiz" class="val">--</span></div>
                <div class="card">TRIGO <span id="val-trigo" class="val">--</span></div>
            </div>
        </div>
        <div id="v" class="section">
            <div class="grid">
                <div class="card">NOVILLO <span id="val-novillo" class="val">--</span></div>
                <div class="card">TERNERO <span id="val-ternero" class="val">--</span></div>
                <div class="card">VACA <span id="val-vaca" class="val">--</span></div>
            </div>
        </div>
        <div id="i" class="section">
            <div class="grid">
                <div class="card">UREA/SOJA <span id="ratio-u-s" class="val">--</span><span id="badge-u-s" class="badge">--</span></div>
            </div>
        </div>
    </div>
    <script>
        function tab(id, b) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active-sec'));
            document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(id).classList.add('active-sec');
            b.classList.add('active');
        }
    </script>
</body>
</html>
