<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agros Sin Fronteras</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Mulish:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  /* Mantengo tus estilos originales intactos */
  :root { --verde: #2d6a1f; --verde-claro: #4caf50; --verde-neon: #76c442; --tierra: #a0522d; --dorado: #e8b74d; --dorado-claro: #f5d98b; --oscuro: #121a0e; --oscuro2: #1c2816; --gris: #2e3b28; --blanco: #f4f7f0; --rojo: #e05252; --azul: #4a90d9; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--oscuro); color: var(--blanco); font-family: 'Mulish', sans-serif; min-height: 100vh; }
  .perfil-header { background: linear-gradient(160deg, var(--oscuro2) 0%, #0e1e08 60%, #1a2e10 100%); border-bottom: 2px solid var(--verde-neon); padding: 0; position: relative; overflow: hidden; }
  .cover-band { height: 90px; background: linear-gradient(90deg, var(--verde) 0%, #3a7d22 40%, var(--dorado) 100%); position: relative; overflow: hidden; }
  .perfil-info { display: flex; align-items: flex-end; gap: 20px; padding: 0 30px 20px; position: relative; margin-top: -40px; }
  .avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--verde-neon); background: linear-gradient(135deg, var(--verde) 0%, var(--dorado) 100%); display: flex; align-items: center; justify-content: center; font-size: 38px; flex-shrink: 0; box-shadow: 0 0 20px rgba(118,196,66,0.4); }
  .perfil-texto { flex: 1; padding-top: 46px; }
  .perfil-nombre { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; color: var(--verde-neon); line-height: 1; }
  .perfil-handle { color: var(--dorado); font-size: 0.82rem; font-weight: 600; letter-spacing: 1px; margin-top: 2px; }
  .perfil-bio { margin-top: 8px; font-size: 0.85rem; color: #b8c9b0; line-height: 1.5; max-width: 500px; }
  .tabs { display: flex; border-bottom: 2px solid var(--gris); background: var(--oscuro2); position: sticky; top: 0; z-index: 100; }
  .tab { padding: 14px 22px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; color: #7a9b72; border-bottom: 3px solid transparent; transition: all 0.2s; white-space: nowrap; }
  .tab.active { color: var(--verde-neon); border-bottom-color: var(--verde-neon); }
  .main { max-width: 900px; margin: 0 auto; padding: 0 16px 60px; }
  .section { display: none; padding-top: 28px; }
  .section.active { display: block; }
  .precios-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; margin-bottom: 30px; }
  .precio-card { background: linear-gradient(135deg, var(--oscuro2) 0%, var(--gris) 100%); border: 1px solid rgba(118,196,66,0.2); border-radius: 12px; padding: 18px 16px; position: relative; overflow: hidden; }
  .precio-valor { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--blanco); line-height: 1; }
  .tc-badge { background: var(--gris); border: 1px solid rgba(118,196,66,0.2); border-radius: 8px; padding: 8px 16px; font-size: 0.75rem; color: #7a9b72; display: inline-flex; gap: 8px; margin-bottom: 20px; }
  .tc-val { color: var(--dorado); font-weight: 700; }
  .ip-card { background: var(--oscuro2); border: 1px solid rgba(118,196,66,0.15); border-radius: 14px; padding: 20px; margin-bottom: 16px;}
  .ip-row { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.8rem; }
  .ip-qty { font-weight: 700; color: var(--blanco); }
</style>
</head>
<body>

<div class="perfil-header">
  <div class="cover-band"></div>
  <div class="perfil-info">
    <div class="avatar">🌾</div>
    <div class="perfil-texto">
      <div class="perfil-nombre">Agros Sin Fronteras</div>
      <div class="perfil-handle">@agrosinfronterasok</div>
      <div class="perfil-bio">🌱 Información agropecuaria automatizada · Datos al instante.</div>
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" onclick="showTab('granos')">🌾 Pizarra</div>
  <div class="tab" onclick="showTab('insumos')">⚗️ Insumo/Prod</div>
</div>

<div class="main">
  <div class="section active" id="granos">
    <div class="tc-badge">
      💵 TC BNA Dólar Divisa: <span id="valor-dolar" class="tc-val">$1.382,50</span>
    </div>

    <div class="precios-grid">
      <div class="precio-card">
        <div class="precio-emoji">🟡</div>
        <div>Soja Rosario</div>
        <div id="precio-soja" class="precio-valor">$430.000</div>
      </div>
      <div class="precio-card">
        <div class="precio-emoji">🌽</div>
        <div>Maíz Rosario</div>
        <div id="precio-maiz" class="precio-valor">$262.675</div>
      </div>
    </div>
  </div>

  <div class="section" id="insumos">
    <div class="ip-card">
      <h3>Relación Urea / Grano</h3>
      <div class="ip-row">
        <span>Soja (qq para 100kg Urea)</span>
        <span id="rel-urea-soja" class="ip-qty">18.0</span>
      </div>
      <div class="ip-row">
        <span>Maíz (qq para 100kg Urea)</span>
        <span id="rel-urea-maiz" class="ip-qty">22.0</span>
      </div>
    </div>
  </div>
</div>

<script>
  function showTab(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
  }
</script>
</body>
</html>
