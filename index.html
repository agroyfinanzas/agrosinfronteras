<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard ASF</title>
    <style>
        :root { --bg: #0d0f0d; --accent: #76c442; --text: #e0e7dc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
        .card { background: #1a1d1a; padding: 20px; border-radius: 10px; border: 1px solid #333; }
        .val { font-size: 2rem; font-weight: bold; display: block; color: #fff; }
        .badge { padding: 5px; border-radius: 5px; font-size: 0.8rem; border: 1px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>
    <header><h1>AGROS SIN FRONTERAS</h1></header>
    <div style="color: #e8b74d">DÓLAR: <span id="val-dolar">$1,419.00</span></div>
    <div class="grid">
        <div class="card">SOJA <span id="val-soja" class="val">--</span></div>
        <div class="card">MAÍZ <span id="val-maiz" class="val">--</span></div>
        <div class="card">NOVILLO <span id="val-novillo" class="val">--</span></div>
        <div class="card">UREA/SOJA <span id="ratio-u-s" class="val">--</span> <span id="badge-u-s" class="badge buena">BUENA</span></div>
    </div>
</body>
</html>
